name: Manual R2 synthetic verification
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: 'Exact reviewed 40-character commit SHA on inop-main'
        required: true
        type: string
      confirmation:
        description: 'Type CREATE ONE 64 BYTE SYNTHETIC OBJECT AND RETAIN IT'
        required: true
        type: string
      retain_object:
        description: 'Approve indefinite retention of one 64-byte synthetic object; no DELETE'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: r2-synthetic-verification-single
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'isgandarovusal/INOP' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/inop-main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    env:
      R2_SYNTHETIC_ACTIONS_ENABLED: ${{ vars.R2_SYNTHETIC_ACTIONS_ENABLED }}
      R2_APPROVED_SHA: ${{ inputs.approved_sha }}
      R2_APPROVAL_PHRASE: ${{ inputs.confirmation }}
      R2_RETENTION_APPROVED: ${{ inputs.retain_object }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require owner, exact commit, explicit retention and protected environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node Backend/scripts/verifyR2Actions.cjs --preflight
  verify:
    needs: preflight
    if: needs.preflight.result == 'success' && github.repository == 'isgandarovusal/INOP' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/inop-main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    environment: r2-synthetic-verification
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: One approved retained synthetic object, no retries or cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          R2_SYNTHETIC_ACTIONS_ENABLED: ${{ vars.R2_SYNTHETIC_ACTIONS_ENABLED }}
          R2_APPROVED_SHA: ${{ inputs.approved_sha }}
          R2_APPROVAL_PHRASE: ${{ inputs.confirmation }}
          R2_RETENTION_APPROVED: ${{ inputs.retain_object }}
          HR_CV_STORAGE_PROVIDER: s3
          HR_CV_STORAGE_ENDPOINT: ${{ secrets.R2_VERIFY_ENDPOINT }}
          HR_CV_STORAGE_BUCKET: inop-private-cv
          HR_CV_STORAGE_REGION: auto
          HR_CV_STORAGE_ACCESS_KEY_ID: ${{ secrets.R2_VERIFY_ACCESS_KEY_ID }}
          HR_CV_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.R2_VERIFY_SECRET_ACCESS_KEY }}
          HR_CV_STORAGE_SESSION_TOKEN: ${{ secrets.R2_VERIFY_SESSION_TOKEN }}
          HR_CV_DURABLE_INTAKE_ENABLED: 'false'
          HR_CV_SCAN_ENABLED: 'false'
          HR_CV_INTAKE_WORKER_ENABLED: 'false'
          HR_CV_OCR_ENABLED: 'false'
          HR_CV_PROCESSING_ENABLED: 'false'
          HR_CV_AI_PROCESSING_ENABLED: 'false'
        run: node Backend/scripts/verifyR2Actions.cjs --execute
