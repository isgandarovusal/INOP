services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "inop-dev", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local development only. Existing volumes require operator backup/review first.
  mongo-init:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "mongodb://mongo:27017/?directConnection=true", "--quiet", "--eval"]
    command:
      - |
        try { const cfg = rs.conf(); if (cfg._id !== "inop-dev") throw Error("Unexpected replica set; manual review required"); }
        catch (error) { if (error.code === 94) rs.initiate({_id:"inop-dev",members:[{_id:0,host:"mongo:27017"}]}); else throw error; }
        for (let n=0;n<30;n++) { if (db.hello().isWritablePrimary) quit(0); sleep(1000); }
        quit(1);

  backend:
    restart: unless-stopped
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/inop?replicaSet=inop-dev
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./Backend/uploads:/app/uploads

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3001/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
